name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt pytest

      - name: Configure
        # pybind11 is located through the interpreter, so it must already be
        # installed by the step above.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPYBIND11_FINDPYTHON=ON
          -DPython_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Build
        run: cmake --build build --config Release

      - name: C++ unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Python unit tests
        run: python -m pytest tests -q

      - name: Book validation (synthetic day, 0 drift required)
        # Runs keyless, so it exercises the synthetic path. Any mismatch
        # fails the build, which is the point of the deliverable.
        run: python validation/validate_book.py --checkpoints 200

      - name: End-to-end backtest
        run: python scripts/run_backtest.py
